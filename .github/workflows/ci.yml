name: CI

on:
  push:
  pull_request:

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Pruebas + cobertura (mínimo 80%)
        run: pytest --cov=src --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci_only
      - name: Construir imagen de producción
        run: docker build --target runtime -t ferremax-api .
      - name: Smoke test del contenedor
        run: |
          docker run -d --name api -p 8000:8000 ferremax-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/docs > /dev/null
