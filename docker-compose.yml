services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferremax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-ferremax}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferremax} -d ${POSTGRES_DB:-ferremax}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferremax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ferremax}
      DATA_DIR: datos
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: ["tests"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-ferremax}:${POSTGRES_PASSWORD}@db:5432/ferremax_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
