services:
  - type: web
    name: ferremax-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: datos
      - key: DATABASE_URL
        fromDatabase:
          name: ferremax-db
          property: connectionString

databases:
  - name: ferremax-db
    plan: free
